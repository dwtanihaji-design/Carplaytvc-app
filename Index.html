<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەپی پەخش و براوسەر</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ff3b30; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #333; }
        .card:hover { background: #2c2c2c; }
        iframe { width: 100%; height: 350px; border-radius: 12px; margin-top: 20px; border: none; background: #000; }
    </style>
</head>
<body>

    <h1>پەخشی ڕاستەوخۆ و یوتوب</h1>
    
    <div class="grid">
        <div class="card" onclick="loadContent('https://www.youtube.com')">یوتیوب</div>
        <div class="card" onclick="loadContent('https://www.tiktok.com')">تیکتۆک</div>
        <div class="card" onclick="loadContent('https://www.google.com')">گۆگل و سایتەکان</div>
    </div>

    <div id="player-container">
        <iframe id="webFrame" src="https://www.youtube.com" allowfullscreen></iframe>
    </div>

    <script>
        function loadContent(url) {
            document.getElementById('webFrame').src = url;
        }
    </script>

</body>
</html>
